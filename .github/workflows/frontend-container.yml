name: frontend-container

# Builds the frontend image and publishes it to GitHub Container Registry.
#
# This replaces an Azure Static Web Apps deployment. Every region Static Web Apps
# offers is blocked by the region policy on this subscription, so the frontend is
# served by nginx as a third Container App alongside the backend and BERT service.
# nginx proxies /api to the backend, keeping the browser on a single origin and
# avoiding CORS configuration entirely.
#
# Deployment is a separate manual step; see the note in backend-container.yml.
on:
  push:
    branches:
      - main
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-container.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve image name
        id: meta
        shell: bash
        run: |
          owner="${{ github.repository_owner }}"
          echo "image=${REGISTRY}/${owner,,}/mras-frontend" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: frontend/Dockerfile
          push: true
          # Same-origin: the browser calls /api on the frontend host and nginx
          # proxies it onward, so no backend URL is baked into the bundle.
          build-args: |
            VITE_API_BASE_URL=/api
          tags: |
            ${{ steps.meta.outputs.image }}:${{ github.sha }}
            ${{ steps.meta.outputs.image }}:latest

      - name: Summary
        shell: bash
        run: |
          {
            echo "### Frontend image published"
            echo ""
            echo "- \`${{ steps.meta.outputs.image }}:${{ github.sha }}\`"
            echo ""
            echo "Deploy with \`scripts/deploy_azure.ps1\`."
          } >> "$GITHUB_STEP_SUMMARY"

name: bert-service-container

# Builds the DistilBERT service image and publishes it to GitHub Container
# Registry. The fine-tuned checkpoint is fetched from the artifact release during
# the build and verified against its manifest; the build fails rather than
# producing an image that would serve the wrong weights.
#
# Deployment is a separate manual step. See the note in backend-container.yml.
on:
  push:
    branches:
      - main
    paths:
      - 'bert_service/**'
      - '.github/workflows/bert-service-container.yml'
  workflow_dispatch:
    inputs:
      artifact_release_tag:
        description: 'Release tag holding the model artifact bundles'
        required: false
        default: 'artifacts-v1'

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  DEFAULT_ARTIFACT_TAG: artifacts-v1

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space
        shell: bash
        run: |
          # The image approaches 3 GB and the runner ships with toolchains this
          # build never uses; without this the push can run the disk out.
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          df -h /

      - name: Resolve image name and artifact tag
        id: meta
        shell: bash
        run: |
          owner="${{ github.repository_owner }}"
          echo "image=${REGISTRY}/${owner,,}/mras-bert-service" >> "$GITHUB_OUTPUT"
          echo "artifact_tag=${{ inputs.artifact_release_tag || env.DEFAULT_ARTIFACT_TAG }}" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: bert_service/Dockerfile
          push: true
          build-args: |
            ARTIFACT_REPO=${{ github.repository }}
            ARTIFACT_RELEASE_TAG=${{ steps.meta.outputs.artifact_tag }}
          tags: |
            ${{ steps.meta.outputs.image }}:${{ github.sha }}
            ${{ steps.meta.outputs.image }}:latest

      - name: Summary
        shell: bash
        run: |
          {
            echo "### DistilBERT service image published"
            echo ""
            echo "- \`${{ steps.meta.outputs.image }}:${{ github.sha }}\`"
            echo "- Checkpoint from release \`${{ steps.meta.outputs.artifact_tag }}\`, verified against its manifest"
            echo ""
            echo "Deploy with \`scripts/deploy_azure.ps1\`."
          } >> "$GITHUB_STEP_SUMMARY"
